name: CPU verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Create isolated environment
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == Windows ]]; then
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            printf '%s\n' "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Build the source distribution and install its wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          python -m pip check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check command-line entry points
        run: |
          for tool in analyze collect_predictions compare_tdc demographics install_inputs plot_figures prepare_data reproduce validate_models; do
            python "scripts/$tool.py" --help > /dev/null
          done
      - name: Rebuild reference figures
        run: |
          python scripts/plot_figures.py --output outputs/ci/reference-figures --formats svg
          python -c "from pathlib import Path; p = Path('outputs/ci/reference-figures'); assert len(list(p.glob('*.svg'))) == 10; assert (p / 'figure_coordinates.csv').stat().st_size > 0"
